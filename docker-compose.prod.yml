services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
    networks:
      - frontend

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgres://yesod_user:secure_password@db:5432/yesod_db
    networks:
      - frontend
      - backend

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: yesod_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: yesod_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    expose:
      - "5432"

volumes:
  db_data:


networks:
  frontend:
  backend:
    internal: true
